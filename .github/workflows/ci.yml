name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the current package version to npm
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Show tool versions
        run: |
          node --version
          npm --version

      - name: Run checks
        run: npm run check

      - name: Build npm tarball
        run: |
          mkdir -p dist
          npm pack --pack-destination dist

      - name: Upload npm tarball
        uses: actions/upload-artifact@v7
        with:
          name: npm-tarball
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    needs: test
    if: >-
      github.repository == 'lolkda/dsh-mcp-proxy' &&
      (github.event_name == 'workflow_dispatch' && inputs.publish == true ||
       github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Ensure npm supports trusted publishing
        run: |
          npm install --global npm@^11.15.0
          node --version
          npm --version

      - name: Verify package metadata
        run: |
          node <<'NODE'
          const pkg = require('./package.json')
          if (pkg.private === true) {
            console.error('package.json must not be private')
            process.exit(1)
          }
          if (pkg.repository?.url !== 'git+https://github.com/lolkda/dsh-mcp-proxy.git') {
            console.error('repository.url must match the GitHub repository')
            process.exit(1)
          }
          console.log(`publishing ${pkg.name}@${pkg.version}`)
          NODE

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::tag v$TAG does not match package version $VERSION"
            exit 1
          fi

      - name: Publish with OIDC trusted publishing
        run: npm publish --access public
